name: CI

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Tao API key gia cho CI
        run: echo "TMDB_API_KEY=ci_dummy_key" >> local.properties

      - name: Run ktlint, tests and assembleDebug
        run: ./gradlew ktlintCheck test assembleDebug